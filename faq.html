<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BeeNudge - FAQ</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{
 --bg:#FFF6D5;--surface:#FFFDF3;--surface-2:#FCEDB4;--line:#EBD58A;
 --ink:#4F2E23;--ink-2:#7B5A49;
 --yellow:#F7D154;--yellow-d:#E9B72E;--gold:#9A6A00;
 --dark:#0D2420;--dark-2:#173A33;--mint:#CDE5BF;--mint-l:#E5F1DA;
 --sky:#CFF3F1;--sky-d:#A5CFE3;--link:#2B7A8C;
 --blush:#F9A57A;--red:#C8503F;--green:#2E7D6B;
 --input:#F6E7AA;--radius:16px;
 --shadow:0 1px 2px rgba(79,46,35,.08),0 6px 18px rgba(79,46,35,.07);
 /* alias lama */
 --navy:var(--ink);--btn:var(--dark);--accent:var(--yellow);--blue:var(--link);--card:var(--surface);--head:var(--mint-l);--white:#fff
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--link)}
:focus-visible{outline:3px solid #2B7A8C66;outline-offset:2px}
.hide{display:none!important}
.logo-img{display:block;max-width:100%;height:auto}
/* ---------- auth ---------- */
.auth{min-height:100vh;max-width:1160px;margin:0 auto;padding:40px 32px;display:grid;grid-template-columns:1fr minmax(0,480px);align-items:center;gap:56px}
.brand{position:relative;display:flex;justify-content:center}
.brand::before{content:"";position:absolute;inset:8%;background:radial-gradient(circle,#F7D15466 0%,transparent 68%);z-index:0}
.brand .logo-img{position:relative;width:min(400px,100%)}
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:40px;box-shadow:var(--shadow)}
.auth-card h1{font-size:30px;line-height:1.2}
.auth-card .sub{font-size:13px;margin:6px 0 20px;color:var(--ink-2)}
.auth-card label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
.pill-in{width:100%;height:44px;border-radius:22px;border:2px solid transparent;background:var(--input);padding:0 20px;color:var(--ink)}
.pill-in:focus{outline:none;border-color:var(--ink);background:#fff}
.pill-in::placeholder{color:#9C8456}
select.pill-in{appearance:auto;padding:0 16px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin:16px 0 24px}
.btn-main{width:100%;height:48px;border-radius:24px;background:var(--yellow);color:var(--ink);font-weight:800;font-size:16px;box-shadow:inset 0 -3px 0 #E0AE2A}
.btn-main:hover{background:#F2C73F}
.err{background:#FBE3DD;color:#8E2A1B;border-radius:10px;padding:10px 14px;font-size:13px;margin-top:14px}
.ok-note{background:#E0F1DA;color:#1C4A2B;border-radius:10px;padding:10px 14px;font-size:13px;margin-top:14px}
.demo{margin-top:22px;font-size:13px;background:var(--surface-2);border-radius:12px;padding:12px 14px;line-height:1.9}
.demo button{background:var(--dark);color:var(--mint);border-radius:6px;padding:1px 10px;margin-right:6px;font-size:12px;font-weight:600}
/* ---------- umum ---------- */
.btn{background:var(--dark);color:var(--mint);border-radius:10px;padding:8px 16px;font-weight:600;font-size:14px;transition:background .15s}
.btn:hover{background:var(--dark-2)}
.btn.dk{padding:6px 16px}
.btn.red{background:var(--red);color:#fff;font-size:13px;padding:5px 14px;border-radius:8px}
.btn.red:hover{background:#B0412F}
.btn.ghost{background:var(--sky);color:var(--ink)}
.btn.ghost:hover{background:#B9E8E5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{background:var(--mint-l);text-align:left;padding:12px 16px;font-size:13px;font-weight:700;color:var(--ink)}
.tbl td{padding:14px 16px;border-top:1px solid #F0E2AE;vertical-align:top;font-size:14px}
.tbl tbody tr:hover td{background:#FFF9DD}
.tbl.soft{background:transparent;border:0;border-radius:0;overflow:visible}
.tbl.soft th{background:transparent;border-bottom:2px solid var(--line);font-size:14px}
.tbl.soft td{border-top:0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl.soft tbody tr:hover td{background:transparent}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700}
.tag.ok{background:var(--green)}.tag.mute{background:#8A7366}
.ico{width:18px;height:18px;vertical-align:middle}
.ib{padding:6px;border-radius:8px}.ib:hover{background:#F6E7AA}
.empty{padding:32px;text-align:center;color:var(--ink-2)}
/* ---------- admin ---------- */
.admin{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface-2);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .logo{text-align:center;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.side .logo img{width:128px;margin:0 auto}
.side nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.side nav button{display:block;width:100%;text-align:left;padding:11px 16px;font-weight:600;font-size:15px;border-radius:10px}
.side nav button:hover{background:#F7E39A}
.side nav button.on{background:var(--yellow);font-weight:700}
.side .out{margin-top:auto;color:var(--red);font-weight:700;padding:11px;border-radius:10px;border:1px solid var(--line);text-align:center}
.side .out:hover{background:#FBE3DD}
.amain{padding:28px 40px 56px;min-width:0;width:100%;max-width:1360px;margin:0 auto}
.phead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.phead h1{font-size:26px;font-weight:700;line-height:1.2}
.ahead{display:flex;align-items:center;gap:24px;padding-bottom:18px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.ahead h2{font-size:24px;line-height:1.2}.ahead p{color:var(--ink-2)}
.search{flex:1;max-width:520px;display:flex;align-items:center;background:var(--yellow);border-radius:24px;height:44px;padding:0 6px 0 20px;gap:8px;box-shadow:inset 0 -2px 0 #E0AE2A}
.ahead .search{margin-left:auto}
.search input{flex:1;background:none;border:0;color:var(--ink);font-weight:600;font-size:15px;min-width:0}
.search input:focus{outline:none}
.search input::placeholder{color:#7B5A49;font-weight:500}
.search button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.search button:hover{background:#F2C73F}
.me{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap}
.bell{position:relative;display:inline-flex}.bell i{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:50%;width:16px;height:16px;text-align:center;line-height:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow)}
.stat:nth-child(1){border-top:4px solid var(--yellow)}.stat:nth-child(2){border-top:4px solid var(--green)}.stat:nth-child(3){border-top:4px solid var(--blush)}.stat:nth-child(4){border-top:4px solid var(--sky-d)}
.stat span{font-size:14px;color:var(--ink-2);font-weight:600}.stat b{font-size:32px;line-height:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.card h3{font-size:19px;font-weight:700;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.vall{background:var(--yellow);color:var(--ink);font-size:11px;border-radius:999px;padding:4px 14px;font-weight:700}
.vall:hover{background:#F2C73F}
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding:4px 8px 0;border-bottom:1px solid var(--line)}
.chart .g{flex:1;display:flex;align-items:flex-end;gap:3px;height:100%}
.chart .g i{flex:1;background:var(--green);display:block;border-radius:3px 3px 0 0}.chart .g i+i{background:var(--dark)}
.xl{display:flex;gap:10px;padding:6px 8px;font-size:11px;color:var(--ink-2)}.xl span{flex:1;text-align:center}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;margin-bottom:8px}.legend i{display:inline-block;width:22px;height:8px;margin-right:6px;border-radius:2px}
.appr{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.appr:last-child{border-bottom:0}
.appr small{display:block;font-size:12px;color:var(--ink-2)}.appr b{font-size:15px}
.mod{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:20px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px 18px;box-shadow:var(--shadow)}
.pcard .top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.pcard .top .tag{margin-left:auto}
.pcard p{margin-bottom:14px;word-break:break-word}.pcard .btn{display:block;margin:0 auto}
.pcard .top span{color:var(--ink-2);font-size:13px}
.prof{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.prof .pic{text-align:center;padding:40px 24px}
.prof .pic .big{width:200px;height:200px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:80px;color:#fff;font-weight:700;border:6px solid var(--yellow)}
.frow{display:flex;margin-bottom:20px}.frow .pill-in{border-radius:22px 0 0 22px;flex:1}.frow .btn{border-radius:0 22px 22px 0;height:44px;padding:0 22px}
.fl{font-weight:700;margin-bottom:6px;font-size:14px}
/* ---------- halaman pengguna ---------- */
.user{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:100vh}
.ucol{padding:0 32px 100px;min-width:0}
.uin{max-width:760px;margin:0 auto;position:relative}
.utop{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:16px;padding:16px 0 12px}
.utop .search{max-width:none}
.mini-logo{flex:none;display:block}.mini-logo img{width:46px;height:auto}
.avw{position:relative;display:inline-block;flex:none}
.avw .st{position:absolute;left:-10px;top:-8px;width:24px;height:24px;filter:drop-shadow(0 1px 1px #4F2E2344)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;overflow:hidden;line-height:1}
.menu{position:absolute;top:70px;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #4F2E2330;padding:6px;z-index:30;min-width:220px}
.menu div{padding:10px 12px;font-size:13px;border-bottom:1px solid #F0E2AE;margin-bottom:4px}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-weight:600}
.menu button:hover{background:#FFF3C4}.menu .lo{color:var(--red)}
.unav{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
.unav button{padding:7px 16px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px;border:1px solid transparent}
.unav button:hover{border-color:var(--line)}
.unav button.on{background:var(--yellow);font-weight:700}
.ptitle{font-size:24px;font-weight:700;margin:6px 0 20px}
.sect{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px;font-weight:700;font-size:16px}
.feed{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.post{padding:20px 24px 6px 40px;border-bottom:1px solid var(--line);position:relative}
.post:last-child{border-bottom:0}
.post .hd{display:flex;gap:14px;align-items:flex-start}
.post .nm{font-weight:700}.post .un{color:var(--gold);margin:0 6px;font-weight:500}
.post .tx{margin-top:4px;line-height:1.55;word-break:break-word}
.post .mt{color:var(--link);font-weight:600}
.post .pin{font-size:12px;margin-bottom:6px;display:flex;gap:6px;align-items:center;color:var(--ink-2);font-weight:600}
.post .ttl{font-weight:700;font-size:16px}
.imgs{display:flex;margin-top:12px;border:1px solid var(--line);max-width:640px;border-radius:12px;overflow:hidden}
.imgs img{flex:1;min-width:0;height:160px;object-fit:cover;display:block}.imgs img+img{border-left:2px solid var(--surface)}
.acts{display:flex;justify-content:space-around;padding:10px 0}
.acts button{display:flex;gap:6px;align-items:center;color:var(--gold);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.acts button:hover{background:#FBEBA6}.acts button.on{color:var(--red)}
.fl2{font-size:11px;font-weight:600;background:var(--surface-2);border-radius:999px;padding:2px 10px;margin-left:6px;color:var(--ink)}
button.fl2:hover{background:var(--yellow)}
.fab{position:fixed;right:calc(400px + 32px);bottom:28px;width:56px;height:56px;border-radius:50%;background:var(--yellow);color:var(--ink);font-size:32px;font-weight:600;box-shadow:0 6px 16px #4F2E2340,inset 0 -3px 0 #E0AE2A;z-index:10;line-height:1}
.fab:hover{background:#F2C73F}
.rcol{background:var(--surface-2);border-left:1px solid var(--line);padding:24px 20px 40px;min-width:0;position:sticky;top:0;height:100vh;overflow:auto}
.ptabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:20px}
.ptabs button{flex:1;padding:10px;font-weight:700;font-size:16px;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-2px}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.hello{font-size:18px;font-weight:700}.hello+small{display:block;font-size:13px;color:var(--ink-2);margin:2px 0 14px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.plan .lbl{display:inline-block;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:700;padding:3px 14px;border-radius:999px;margin-bottom:10px}
.pi{background:var(--sky);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:13px}.pi b{display:flex;justify-content:space-between;gap:8px}
.pi ul{margin:4px 0 0 18px}
.calsel{display:flex;gap:12px;margin:14px 0 10px}.calsel select{flex:1;background:var(--surface);border:1px solid var(--line);padding:8px 10px;font-size:13px;border-radius:8px}
.cal{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);font-size:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal th{padding:10px 0;background:var(--mint-l);font-weight:700}
.cal td{height:34px;text-align:center;border-top:1px solid #F0E2AE;cursor:pointer}
.cal td:hover:not(.x){background:#FFF0B3}.cal td.sel{background:var(--yellow);font-weight:800}
.cal td.ev{box-shadow:inset 0 -3px 0 var(--green)}.cal td.today{font-weight:800;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px}
.chip:hover{background:#FFF0B3}.chip.on{background:var(--yellow);border-color:var(--yellow-d)}
.cfeed{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}.cfeed .post{padding:16px 14px 4px 40px}
.ncard,.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.ncard .hd{display:flex;gap:12px;align-items:center;margin-bottom:12px}.ncard small{display:block;color:var(--ink-2)}
.mcard{display:flex;gap:14px;align-items:center;cursor:pointer;padding:14px 18px;margin-bottom:12px}
.mcard:hover{background:#FFF9DD}.mcard .b{flex:1;min-width:0}.mcard p{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .c{text-align:right;font-size:12px;color:var(--ink-2)}.mcard .c b{display:inline-block;background:var(--dark);color:var(--mint);border-radius:999px;padding:0 9px;margin-top:4px}
.faq{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;background:#F6E7AA}
.faq summary{padding:16px 20px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.faq summary::after{content:"⌄";font-size:18px}.faq[open] summary::after{content:"⌃"}
.faq .ans{background:#fff;padding:14px 20px;line-height:1.7}
.faq ul{margin-left:20px}
.sbox{display:flex;gap:12px;margin-bottom:22px}.sbox .pill-in{flex:1}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.ccard h4{font-size:17px;margin-bottom:4px}.ccard p{font-size:13px;margin:8px 0 14px;line-height:1.5;color:var(--ink-2)}
/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:#4F2E2366;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:18px;padding:26px;width:min(560px,100%);max-height:90vh;overflow:auto;position:relative;box-shadow:0 20px 50px #4F2E2340}
.modal.wide{width:min(920px,100%);background:var(--bg);padding:24px 32px}
.modal h3{font-size:20px;margin-bottom:12px;padding-right:28px}
.modal .x{position:absolute;right:16px;top:10px;font-size:28px;color:var(--ink-2);line-height:1}
.modal label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
.modal textarea,.modal select,.modal input[type=text],.modal input[type=date],.modal input[type=time],.modal input[type=number]{width:100%;background:var(--input);border:2px solid transparent;border-radius:12px;padding:10px 14px}
.modal textarea:focus,.modal select:focus,.modal input:focus{outline:none;border-color:var(--ink);background:#fff}
.modal textarea{min-height:96px;resize:vertical}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.composer{position:relative;padding-top:20px}
.composer .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;min-height:340px;padding:20px 32px;position:relative;margin-top:-4px}
.composer textarea{width:100%;min-height:230px;background:none;border:0;resize:none;font-size:16px;line-height:1.5}
.composer textarea:focus{outline:none}
.composer textarea::placeholder{color:#9C8456}
.composer .bar{display:flex;gap:8px;align-items:center;margin:0 0 6px 56px;flex-wrap:wrap}
.composer .bar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px}
.composer .bar .sp{flex:1}.composer .bar .lk{color:var(--link);font-weight:700;font-size:13px;padding:4px 10px}
.composer .bar .post{background:var(--yellow);color:var(--ink);border-radius:999px;padding:5px 22px;font-size:13px;font-weight:700;border:0}
.tools{display:flex;gap:14px;justify-content:flex-end;align-items:center}
.cnt{font-size:13px;margin-right:auto;color:var(--ink-2)}.cnt.over{color:var(--red);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.chat{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}
.bub{max-width:75%;padding:9px 14px;border-radius:14px;background:#fff;border:1px solid var(--line)}.bub.me{align-self:flex-end;background:var(--yellow);border-color:var(--yellow)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--mint);padding:12px 22px;border-radius:999px;z-index:99;font-weight:600;box-shadow:0 8px 24px #0D242055}
/* ---------- profil ---------- */
a.me{color:inherit;text-decoration:none}a.me:hover{opacity:.8}
.post a.nm{color:inherit;text-decoration:none}.post a.un{text-decoration:none}.post a.nm:hover,.post a.un:hover{text-decoration:underline}
.unav .lo{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--red)}
.unav .lo:hover{background:#FBE3DD}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}

 if(!u)return `<span class="av" style="width:${size}px;height:${size}px;background:#888"></span>`;
 if(u.pic)return `<span class="av" style="width:${size}px;height:${size}px;background:url('${u.pic}') center/cover"></span>`;
 return `<span class="av" style="width:${size}px;height:${size}px;background:${COLORS[u.c%COLORS.length]};font-size:${size*.42}px">${esc(u.name[0])}</span>`;
}
function avs(u,size=48){return `<span class="avw">${(u&&u.role!=='mahasiswa')?STAR:''}${av(u,size)}</span>`}
function ago(t){const m=Math.floor((Date.now()-t)/60000);if(m<1)return 'now';if(m<60)return m+'m';const h=Math.floor(m/60);return h<24?h+'h':Math.floor(h/24)+'d'}
function rich(t){return esc(t).replace(/@(\w+)/g,'<span class="mt">@$1</span>')}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},2200)}
function detect(t){
 const l=t.toLowerCase();
 if(/judol|slot gacor|togel/.test(l))return 'Spam Violation';
 if(/bajakan|crack gratis/.test(l))return 'Copyright Infringement';
 if(/bodoh|benci semua|rasis/.test(l))return 'Hate Speech or Discriminatory Content';
 if(/hack akun|bobol|phishing/.test(l))return 'Security Violation';
 return null;
}
function canSee(p){
 const me=S.me,a=U(p.author);
 if(!a||p.author===me.username||me.role==='admin'||p.aud==='everyone')return true;
 if(p.aud==='role')return a.role===me.role;
 if(p.aud==='followers')return (S.follows[me.username]||[]).includes(p.author);
 return false;
}

 return `<nav class="bnav" aria-label="Navigasi utama">${it.map(([k,l,i])=>`<button class="${S.view===k?'on':''}" data-act="go" data-arg="${k}">${i}<span>${l}</span></button>`).join('')}<button data-act="panel">${ic('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>')}<span>Schedule</span></button><button class="${more?'on':''}" data-act="more">${ic('<path d="M4 7h16M4 12h16M4 17h16"/>')}<span>Menu</span></button></nav>`;
}
function labelTables(){
 document.querySelectorAll('table.tbl').forEach(t=>{
  const h=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());
  t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(h[i]&&!td.hasAttribute('colspan'))td.setAttribute('data-label',h[i])}));
 });
}
function render(){
 if(!S.me&&PAGE.role!=='auth')return;
 save();
 const ae=document.activeElement,keep=ae&&ae.id==='ctext'?[ae.selectionStart,ae.selectionEnd]:null;
 let h;
 if(PAGE.role==='auth')h=VIEW();
 else if(S.me.role==='admin')h=adminShell(VIEW());
 else h=userShell(VIEW());
 $('#app').innerHTML=h+showModal()+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');
 labelTables();
 if(keep){const t=$('#ctext');if(t){t.focus();t.setSelectionRange(...keep)}}
 window.scrollTo&&0;
}

/* ================== ACTIONS ================== */
const A={
 mode:a=>{S.authMode=a;S.err='';render()},
 forgot:()=>toast('Link reset password dikirim ke email terdaftar (simulasi).'),
 fill:a=>{const[u,p]=a.split('|');const f=$('form[data-form=login]');f.id.value=u;f.pw.value=p},
 go:a=>{location.href=PAGES[a]},
 resetdemo:()=>{window.__noSave=true;try{localStorage.removeItem(KEY)}catch(e){}location.reload()},
 logout:()=>{if(confirm('Keluar dari BeeNudge?'))logout()},
 menu:()=>{S.menu=!S.menu;render()},
 tab:a=>{S.tab=a;render()},ctab:a=>{S.commTab=+a;render()},seld:a=>{S.selDate=a;render()},
 close:()=>{S.modal=null;render()},
 closeov:(a,el,e)=>{if(e.target===el){S.modal=null;render()}},
 approve:a=>{const u=S.users.find(x=>x.id==a);u.status='active';notify(u.username,'Akun dosen kamu telah disetujui admin.');toast(`${u.name} disetujui.`)},
 reject:a=>{const u=S.users.find(x=>x.id==a);S.users=S.users.filter(x=>x.id!=a);toast(`${u.name} ditolak.`)},
 rejectu:a=>{const u=S.users.find(x=>x.id==a);if(confirm('Hapus akun '+u.name+'?')){S.users=S.users.filter(x=>x.id!=a);S.posts=S.posts.filter(p=>p.author!==u.username);S.comms.forEach(c=>c.members=c.members.filter(m=>m!==u.username));render()}},
 mailu:a=>toast('Email terkirim ke '+S.users.find(x=>x.id==a).email),
 flagdet:a=>{S.modal={t:'flag',id:+a};render()},repdet:a=>{S.modal={t:'rep',id:+a};render()},
 dismissflag:a=>{S.flags=S.flags.filter(f=>f.post!==+a);S.modal=null;toast('Konten dinyatakan aman.')},
 dismissrep:a=>{S.reports=S.reports.filter(r=>r.id!==+a);S.modal=null;toast('Laporan ditolak.')},
 delpostm:a=>{const p=S.posts.find(x=>x.id===+a);notify(p.author,'Buzzes kamu dihapus admin karena melanggar aturan aplikasi.');deletePost(+a);S.modal=null;toast('Konten dihapus.')},
 members:a=>{S.modal={t:'members',id:+a};render()},rules:a=>{S.modal={t:'rules',id:+a};render()},
 newcomm:()=>{S.modal={t:'newcomm'};render()},
 delcomm:a=>{if(confirm('Hapus community beserta isinya?')){S.comms=S.comms.filter(c=>c.id!==+a);S.posts=S.posts.filter(p=>p.comm!==+a);render()}},
 kick:a=>{const[c,u]=a.split('|'),cm=S.comms.find(x=>x.id===+c);cm.members=cm.members.filter(m=>m!==u);notify(u,`Kamu dikeluarkan dari ${cm.name} karena melanggar guidelines.`);render()},
 editb:a=>{S.modal={t:'editb',id:+a};render()},edits:a=>{S.modal={t:'edits',id:+a};render()},
 delb:a=>{S.broadcasts=S.broadcasts.filter(b=>b.id!==+a);S.modal=null;render()},dels:a=>{S.schedules=S.schedules.filter(b=>b.id!==+a);S.modal=null;render()},
 compose:a=>{S.compose={text:'',aud:'everyone',imgs:[],file:'',comm:a||''};S.modal={t:'compose'};render()},
 drafts:()=>{S.modal={t:'drafts'};render()},
 savedraft:()=>{if(S.compose.text.trim()){S.drafts.push({...S.compose});S.modal=null;toast('Draft disimpan.')}},
 usedraft:a=>{S.compose={...S.drafts[+a]};S.drafts.splice(+a,1);S.modal={t:'compose'};render()},
 deldraft:a=>{S.drafts.splice(+a,1);render()},
 cmention:()=>{S.compose.text+=(S.compose.text&&!/\s$/.test(S.compose.text)?' ':'')+'@';render();$('#ctext').focus()},
 post:()=>{
  const c=S.compose,t=c.text.trim();
  if(!t)return toast('Tulis sesuatu dulu sebelum posting.');
  if(t.length>255)return toast('Buzzes maksimal 255 karakter.');
  const comm=c.comm?+c.comm:null;
  const id=++S.uid;S.posts.push({id,author:S.me.username,text:t,t:Date.now(),aud:c.aud,likes:[],reposts:0,saved:[],comments:[],imgs:c.imgs,comm});
  const r=detect(t);if(r)S.flags.push({post:id,reason:r});
  (t.match(/@(\w+)/g)||[]).forEach(m=>{const un=m.slice(1);if(U(un)&&un!==S.me.username)notify(un,`${S.me.name} menyebut kamu di Buzzes: "${t.slice(0,60)}"`)});
  S.modal=null;S.compose={text:'',aud:'everyone',imgs:[],file:'',comm:''};if(comm){S.tab='community';S.commTab=comm}
  toast(r?'Buzzes terbit dan masuk antrean pengawasan admin.':'Buzzes berhasil dipublikasikan.');
 },
 like:a=>{const p=S.posts.find(x=>x.id===+a),me=S.me.username;if(p.likes.includes(me))p.likes=p.likes.filter(x=>x!==me);else{p.likes.push(me);if(p.author!==me)notify(p.author,`${S.me.name} menyukai Buzzes kamu.`)}render()},
 repost:a=>{S.posts.find(x=>x.id===+a).reposts++;render()},
 save:a=>{const p=S.posts.find(x=>x.id===+a),me=S.me.username;p.saved=p.saved.includes(me)?p.saved.filter(x=>x!==me):[...p.saved,me];render()},
 comment:a=>{S.modal={t:'comment',id:+a};render()},report:a=>{S.modal={t:'report',id:+a};render()},
 delpost:a=>{if(confirm('Hapus Buzzes ini?')){deletePost(+a);render()}},
 follow:a=>{const me=S.me.username,l=S.follows[me]=S.follows[me]||[];S.follows[me]=l.includes(a)?l.filter(x=>x!==a):[...l,a];render()},
 join:a=>{const c=S.comms.find(x=>x.id===+a),me=S.me.username;if(c.members.includes(me))c.members=c.members.filter(x=>x!==me);else{c.members.push(me);toast('Kamu bergabung ke '+c.name);return}render()},
 chat:a=>{const t=S.threads.find(x=>x.id===+a);t.unread=0;S.modal={t:'chat',id:+a};render()},
 newmsg:()=>{S.modal={t:'newmsg'};render()},
 editprofile:()=>{S.pe={};S.modal={t:'editprofile'};render()},
 drawer:()=>{S.drawer=!S.drawer;render()},
 panel:()=>{S.modal={t:'panel'};render()},
 more:()=>{S.modal={t:'more'};render()},
 back:()=>{if(history.length>1)history.back();else location.href=PAGES.home},
 dm:a=>{let t=S.threads.find(x=>x.with===a);if(!t){t={id:++S.uid,with:a,unread:0,msgs:[]};S.threads.push(t)}S.modal={t:'chat',id:t.id};render()}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el){if(S.menu&&!e.target.closest('.menu')){S.menu=false;render()}return}
 if(el.dataset.act==='closeov'&&e.target!==el)return;
 if(el.tagName==='A')e.preventDefault();
 const f=A[el.dataset.act];if(f){f(el.dataset.arg,el,e);if(['approve','reject','dismissflag','dismissrep','delpostm'].includes(el.dataset.act))return}
 if(!['fill'].includes(el.dataset.act)&&!/^(toast)$/.test(el.dataset.act)&&!S._r)render();
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,k=f.dataset.form;if(!k)return;
 if(k==='login')return doLogin(f);
 if(k==='register')return doRegister(f);
 if(k==='aq'||k==='uq'){S.q=f.q.value.trim();return render()}
 if(k==='prof'||k==='uset'){
  const key=f.dataset.k,m=S.me;
  if(key==='pic'){const file=f.v.files[0];if(!file)return toast('Pilih file gambar dulu.');return readImg(file,400,400,d=>{m.pic=d;toast('Foto profil diperbarui.')})}
  const v=f.v.value.trim();if(!v)return toast('Isi kolom terlebih dahulu.');
  if(key==='username'){if(S.users.some(u=>u.username===v.toLowerCase()&&u!==m))return toast('Username sudah dipakai.');m.username=v.toLowerCase()}
  else if(key==='name')m.name=v;else if(key==='email')m.email=v;else if(key==='pw'){if(v.length<6)return toast('Password minimal 6 karakter.');m.pw=v}
  return toast('Perubahan disimpan.');
 }
 if(k==='newcomm'){S.comms.push({id:++S.uid,name:f.name.value.trim(),created:todayStr.slice(8)+'-'+todayStr.slice(5,7)+'-'+todayStr.slice(2,4),desc:f.desc.value,creator:S.me.username,base:0,members:[],rules:f.rules.value,pin:{title:'Welcome',text:'Selamat datang di '+f.name.value.trim()+'!'}});S.modal=null;return toast('Community dibuat.')}
 if(k==='editb'){const id=+f.dataset.id,d={title:f.title.value,contact:f.contact.value,status:f.status.value,desc:f.desc.value,edited:new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})};if(id)Object.assign(S.broadcasts.find(x=>x.id===id),d);else S.broadcasts.push({id:++S.uid,...d});
   if(d.status==='Processing'||d.status==='Complete')notify('*','Pengumuman: '+d.title);S.modal=null;return toast('Broadcast disimpan.')}
 if(k==='edits'){const id=+f.dataset.id,d={faculty:f.faculty.value,contact:f.contact.value,status:f.status.value,date:f.date.value,time:f.time.value,desc:f.desc.value,edited:new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})};if(id)Object.assign(S.schedules.find(x=>x.id===id),d);else S.schedules.push({id:++S.uid,notes:[],...d});S.modal=null;return toast('Jadwal disimpan.')}
 if(k==='comment'){const p=S.posts.find(x=>x.id===+f.dataset.id);p.comments.push({u:S.me.username,t:f.t.value});if(p.author!==S.me.username)notify(p.author,`${S.me.name} mengomentari Buzzes kamu.`);return render()}
 if(k==='report'){const p=S.posts.find(x=>x.id===+f.dataset.id);S.reports.push({id:++S.uid,post:p.id,by:S.me.username,reason:f.r.value});S.modal=null;return toast('Laporan terkirim ke admin.')}
 if(k==='chat'){const t=S.threads.find(x=>x.id===+f.dataset.id);t.msgs.push({f:S.me.username,t:f.t.value});return render()}
 if(k==='editprofile'){
  const m=S.me,E=f.elements,un=E['username'].value.trim().toLowerCase(),old=m.username;
  if(S.users.some(u=>u.username===un&&u!==m))return toast('Username sudah dipakai.');
  if(un!==old){
   const sw=x=>x===old?un:x;
   S.posts.forEach(p=>{if(p.author===old)p.author=un;p.likes=p.likes.map(sw);p.saved=p.saved.map(sw);p.comments.forEach(c=>{if(c.u===old)c.u=un})});
   Object.keys(S.follows).forEach(k2=>{S.follows[k2]=S.follows[k2].map(sw)});
   if(S.follows[old]){S.follows[un]=S.follows[old];delete S.follows[old]}
   S.comms.forEach(c=>{c.members=c.members.map(sw);if(c.creator===old)c.creator=un});
   S.threads.forEach(t=>{if(t.with===old)t.with=un;t.msgs.forEach(x=>{if(x.f===old)x.f=un})});
   S.notifs.forEach(n=>{if(n.from===old)n.from=un;if(n.to===old)n.to=un});
   S.reports.forEach(x=>{if(x.by===old)x.by=un});
   m.username=un;
  }
  m.name=E['name'].value.trim()||m.name;m.bio=E['bio'].value.trim();m.loc=E['loc'].value.trim();
  let w=E['web'].value.trim();if(w&&!/^https?:\/\//i.test(w))w='https://'+w;m.web=w;
  if(S.pe&&S.pe.pic)m.pic=S.pe.pic;if(S.pe&&S.pe.banner)m.banner=S.pe.banner;
  S.pe=null;S.modal=null;
  if(new URLSearchParams(location.search).get('u')===old)history.replaceState(null,'',location.pathname);
  return toast('Profil diperbarui.');
 }
 if(k==='newmsg'){let t=S.threads.find(x=>x.with===f.to.value);if(!t){t={id:++S.uid,with:f.to.value,unread:0,msgs:[]};S.threads.push(t)}t.msgs.push({f:S.me.username,t:f.t.value});S.modal={t:'chat',id:t.id};return render()}
});
document.addEventListener('input',e=>{
 if(e.target.dataset.bind==='ctext'){S.compose.text=e.target.value;const c=$('#cnt');c.textContent=e.target.value.length+'/255';c.classList.toggle('over',e.target.value.length>255)}
});
document.addEventListener('change',e=>{
 const k=e.target.dataset.change;if(!k)return;
 if(k==='calM'){S.calM=+e.target.value;return render()}
 if(k==='calY'){S.calY=+e.target.value;return render()}
 if(k==='cAud'){S.compose.aud=e.target.value;return}
 if(k==='cComm'){S.compose.comm=e.target.value;return}
 if(k==='cFile'){S.compose.file=e.target.files[0]?e.target.files[0].name:'';return render()}
 if(k==='pePic'||k==='peBanner'){
  const fl=e.target.files[0];if(!fl)return;S.pe=S.pe||{};
  const isPic=k==='pePic';
  readImg(fl,isPic?400:1200,isPic?400:360,d=>{
   if(isPic){S.pe.pic=d;$('#pe-pic').innerHTML=`<span class="av" style="width:64px;height:64px;background:url('${d}') center/cover"></span>`}
   else{S.pe.banner=d;$('#pe-banner').style.backgroundImage=`url('${d}')`}
  });return;
 }
 if(k==='cImg'){
  const fs=[...e.target.files].slice(0,4);
  Promise.all(fs.map(f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)}))).then(a=>{S.compose.imgs=a;render()});
 }
});

<script>
/* ===== Halaman: FAQ ===== */
const FAQS=[['How can I reset my password?',['Go to the login page and click "Forgot Password?".','Enter your registered email address.','Check your inbox for a password reset link.','Follow the link and create a new password.']],['How do I change my profile picture?',['Open Settings from the menu.','Choose a new image in the profile picture field.','Press Change to save it.']],['What is the Buzzes character limit?',['Every Buzzes can contain up to 255 characters.','You can tag other users with @username.']],['Who can see my Buzzes?',['Everyone: all users, including your lecturers or students.','Same role only: users with the same role as you.','Followers only: people who follow you.','Admin can still review any Buzzes for violations.']]];
function viewFaq(){
 const q=S.q.toLowerCase(),l=FAQS.filter(f=>!q||f[0].toLowerCase().includes(q));
 return `<div class="sect">How to Login</div>${l.length?l.map((f,i)=>`<details class="faq" ${i===0&&!q?'open':''}><summary>${f[0]}</summary><div class="ans"><ul>${f[1].map(x=>`<li>${x}</li>`).join('')}</ul></div></details>`).join(''):'<div class="empty">Pertanyaan tidak ditemukan.</div>'}`;
}
const VIEW=viewFaq;
boot();
</script>
